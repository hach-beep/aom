<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#7a3f50">
    <title>Our Services & Pricing | The Bridal Bloom</title>
    <style>
        :root { --wine: #713b4d; --rose: #c58c95; --blush: #f8eeed; --cream: #fffaf5; --ink: #30242a; }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin: 0; font-family: Arial, sans-serif; background-color: var(--cream); color: var(--ink); line-height: 1.5; }
        a { color: inherit; text-decoration: none; }
        .wrap { width: min(1140px, 91%); margin: auto; }
        
        /* Navigation Header styling to match Home Page */
        header { position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,.96); backdrop-filter: blur(8px); border-bottom: 1px solid var(--blush); }
        nav { min-height: 76px; display: flex; align-items: center; justify-content: space-between; }
        .brand { font-family: Georgia, serif; font-size: 1.55rem; color: var(--wine); font-weight: 500; }
        .btn { display: inline-flex; justify-content: center; align-items: center; background: var(--wine); color: white; padding: 12px 24px; border: none; font-size: .95rem; cursor: pointer; text-decoration: none; }
        .btn:hover { background: #542a39; }

        /* Modern Hero Page Header */
        .page-header { background: linear-gradient(110deg, #f8f0ef, #fcf8f6); padding: 70px 0; text-align: center; border-bottom: 1px solid var(--blush); }
        .eyebrow { text-transform: uppercase; letter-spacing: 2px; font-size: .75rem; color: var(--rose); margin-bottom: 12px; font-weight: 600; }
        h1, h2, h3 { font-family: Georgia, 'Times New Roman', serif; font-weight: 500; color: var(--wine); margin: 0; }
        h1 { font-size: 2.8rem; margin-bottom: 15px; }
        .subtitle { font-size: 1.05rem; color: #666565; max-width: 550px; margin: 0 auto; line-height: 1.6; }

        /* Modern Grid & Cards Layout */
        .services-section { padding: 75px 0; }
        .services-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; }
        
        .price-card { background: white; border: 1px solid var(--blush); padding: 40px; position: relative; transition: all 0.3s ease; display: flex; flex-direction: column; justify-content: space-between; }
        .price-card:hover { transform: translateY(-4px); border-color: var(--rose); box-shadow: 0 15px 40px rgba(113,59,77,0.04); }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; margin-bottom: 15px; }
        .card-header h3 { font-size: 1.6rem; line-height: 1.2; }
        
        /* Modern Price Badge */
        .price-badge { background: var(--blush); color: var(--wine); font-family: Georgia, serif; font-size: 1.3rem; font-weight: bold; padding: 6px 16px; border-radius: 30px; white-space: nowrap; }
        
        .description { font-size: 1.02rem; color: #666565; margin: 0 0 25px 0; line-height: 1.6; }
        .book-link { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.95rem; color: var(--wine); transition: color 0.2s; }
        .book-link:hover { color: var(--rose); }

        footer { background: #30242a; color: #f8eeed; padding: 30px 0; font-size: 0.9rem; text-align: center; }

        /* Mobile Adjustments */
        @media (max-width: 760px) {
            nav { justify-content: center; flex-direction: column; gap: 15px; padding: 15px 0; }
            .btn { width: 100%; text-align: center; min-height: 48px; }
            .page-header { padding: 50px 0; }
            h1 { font-size: 2.2rem; }
            .services-grid { grid-template-columns: 1fr; gap: 20px; }
            .price-card { padding: 30px 20px; }
            .card-header { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="wrap nav">
            <a class="brand" href="index.html">The Bridal Bloom</a>
            <a class="btn" href="index.html#contact">Book a Visit</a>
        </div>
    </header>

    <main>
        <section class="page-header">
            <div class="wrap">
                <div class="eyebrow">Indulge in Excellence</div>
                <h1>Menu & Pricing</h1>
                <p class="subtitle">Explore our premium selection of luxury salon services tailored meticulously around your schedule and special event requirements.</p>
            </div>
        </section>

        <section class="services-section">
            <div class="wrap">
                <div class="services-grid" id="servicesContainer">
                    <!-- Dynamic Cloud items load directly right here -->
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="wrap"><div>&copy; The Bridal Bloom. All rights reserved.</div></div>
    </footer>

    <!-- Firebase App and Firestore SDK Scripts -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script>
      // Replace with your real Firebase Config Credentials configuration object
const firebaseConfig = {
  apiKey: "AIzaSyB6d5RVyz6F3al09iqBV7ewrbR_n4rXFbo",
  authDomain: "bloom-1959f.firebaseapp.com",
  projectId: "bloom-1959f",
  storageBucket: "bloom-1959f.firebasestorage.app",
  messagingSenderId: "249083863881",
  appId: "1:249083863881:web:737f41f67f559faf61b098",
  measurementId: "G-K1MHZ8BHSR"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
      };
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();

      const servicesContainer = document.getElementById('servicesContainer');

      // Listen to services collection in Firestore in real-time
      db.collection('services').orderBy('createdAt', 'asc').onSnapshot((snapshot) => {
          servicesContainer.innerHTML = '';
          if(snapshot.empty) {
              servicesContainer.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#777;">No services added to the menu yet.</p>';
              return;
          }
          snapshot.forEach((doc) => {
              const service = doc.data();
              servicesContainer.innerHTML += `
                  <article class="price-card">
                      <div>
                          <div class="card-header">
                              <h3>${service.name}</h3>
                              <span class="price-badge">${service.price}</span>
                          </div>
                          <p class="description">${service.description}</p>
                      </div>
                      <a href="index.html#contact" class="book-link">Reserve Service ➔</a>
                  </article>
              `;
          });
      });
    </script>
</body>
</html>
