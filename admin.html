<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Center | The Bridal Bloom</title>
    <style>
        :root { --wine: #713b4d; --rose: #c58c95; --blush: #f8eeed; --cream: #fffaf5; --ink: #30242a; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: var(--cream); color: var(--ink); padding: 20px 10px; }
        .admin-box { max-width: 600px; margin: 0 auto; background: white; border: 1px solid var(--blush); padding: 25px 15px; border-radius: 8px; }
        h1, h2, h3 { font-family: Georgia, serif; color: var(--wine); margin-top: 0; }
        form { display: flex; flex-direction: column; gap: 14px; margin-bottom: 40px; border-bottom: 2px dashed var(--blush); padding-bottom: 30px; }
        label { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; color: #555; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; background: var(--cream); font-size: 1rem; }
        .btn { background: var(--wine); color: white; padding: 14px; border: none; font-size: 1rem; cursor: pointer; width: 100%; font-weight: bold; }
        .roster-item { display: flex; align-items: center; justify-content: space-between; background: var(--cream); padding: 12px; margin-bottom: 10px; border: 1px solid var(--blush); }
        .btn-delete { background: #d9534f; color: white; border: none; padding: 8px 12px; cursor: pointer; }
    </style>
</head>
<body>
<div class="admin-box">
    <h1>Salon Control Center</h1>
    
    <!-- SECTION 1: MANAGE TEAM (Text Only) -->
    <form id="addStaffForm">
        <h2>Add Team Member</h2>
        <label>Full Name</label><input type="text" id="staffName" required placeholder="e.g., Ayesha Khan">
        <label>Job Title / Role</label><input type="text" id="staffRole" required placeholder="e.g., Master Bridal Stylist">
        <label>Short Bio</label><textarea id="staffBio" rows="3" required placeholder="Describe their experience..."></textarea>
        <button type="submit" class="btn" id="submitBtn">Add Team Member</button>
    </form>
    <h3>Live Team Roster</h3>
    <div id="adminRosterList" style="margin-bottom:50px;">Loading...</div>

    <!-- SECTION 2: MANAGE SERVICES -->
    <div style="border-top: 3px solid var(--blush); padding-top: 40px;">
        <form id="addServiceForm">
            <h2>Add Menu Service</h2>
            <label>Service Name</label><input type="text" id="serviceName" required placeholder="e.g., Luxury Hair Styling">
            <label>Price Display</label><input type="text" id="servicePrice" placeholder="e.g., Rs. 15,000" required>
            <label>Service Description</label><textarea id="serviceDescription" rows="3" required placeholder="Service inclusions..."></textarea>
            <button type="submit" class="btn" id="serviceBtn" style="background:var(--rose);">Publish Service</button>
        </form>
        <h3>Live Menu Management</h3>
        <div id="adminServicesList">Loading...</div>
    </div>
</div>
<!-- Load Firebase App (Compat version) -->
<script src="https://gstatic.com"></script>

<!-- Load Firebase Firestore (Compat version) -->
<script src="https://gstatic.com"></script>
    

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyB6d5RVyz6F3al09iqBV7ewrbR_n4rXFbo",
        authDomain: "://firebaseapp.com",
        projectId: "bloom-1959f",
        storageBucket: "bloom-1959f.firebasestorage.app",
        messagingSenderId: "249083863881",
        appId: "1:249083863881:web:737f41f67f559faf61b098",
        measurementId: "G-K1MHZ8BHSR"
      };
      
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();

      // TEAM LOGIC (Direct Text Upload)
      const staffForm = document.getElementById('addStaffForm');
      const submitBtn = document.getElementById('submitBtn');
      
      staffForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          submitBtn.disabled = true;
          submitBtn.textContent = "Saving...";
          
          try {
              await db.collection('team').add({
                  name: document.getElementById('staffName').value,
                  role: document.getElementById('staffRole').value,
                  bio: document.getElementById('staffBio').value,
                  createdAt: firebase.firestore.FieldValue.serverTimestamp()
              });
              staffForm.reset(); 
              alert("Team member saved successfully!");
          } catch (err) { 
              console.error(err);
              alert("Error: " + err.message); 
          } finally { 
              submitBtn.disabled = false; 
              submitBtn.textContent = "Add Team Member"; 
          }
      });

      db.collection('team').orderBy('createdAt', 'asc').onSnapshot(snap => {
          const list = document.getElementById('adminRosterList'); 
          list.innerHTML = snap.empty ? '<p style="color:#777;">No team members registered.</p>':'';
          snap.forEach(doc => { 
              const emp = doc.data(); 
              list.innerHTML += `<div class="roster-item"><div class="roster-info"><strong>${emp.name}</strong> (${emp.role})</div><button class="btn-delete" onclick="deleteTeam('${doc.id}')">Remove</button></div>`; 
          });
      });
      window.deleteTeam = async id => { if(confirm("Delete team member?")) await db.collection('team').doc(id).delete(); };

      // SERVICES LOGIC
      const sForm = document.getElementById('addServiceForm');
      const sBtn = document.getElementById('serviceBtn');

      sForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          sBtn.disabled = true;
          try {
              await db.collection('services').add({
                  name: document.getElementById('serviceName').value,
                  price: document.getElementById('servicePrice').value,
                  description: document.getElementById('serviceDescription').value,
                  createdAt: firebase.firestore.FieldValue.serverTimestamp()
              });
              sForm.reset(); 
              alert("Service published successfully!");
          } catch(err) { 
              alert("Error publishing service."); 
          } finally { 
              sBtn.disabled = false; 
              sBtn.textContent = "Publish Service"; 
          }
      });

      db.collection('services').orderBy('createdAt', 'asc').onSnapshot(snap => {
          const list = document.getElementById('adminServicesList'); 
          list.innerHTML = snap.empty ? '<p style="color:#777;">No services published yet.</p>':'';
          snap.forEach(doc => { 
              const s = doc.data(); 
              list.innerHTML += `<div class="roster-item"><div class="roster-info"><strong>${s.name}</strong> (${s.price})</div><button class="btn-delete" onclick="deleteService('${doc.id}')">Delete</button></div>`; 
          });
      });
      window.deleteService = async id => { if(confirm("Delete service?")) await db.collection('services').doc(id).delete(); };
    </script>
</body>
</html>
