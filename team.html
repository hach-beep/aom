<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#7a3f50">
    <title>Our Team | The Bridal Bloom</title>
    <style>
        :root { --wine: #713b4d; --rose: #c58c95; --blush: #f8eeed; --cream: #fffaf5; --ink: #30242a; }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin: 0; font-family: Arial, sans-serif; background-color: var(--cream); color: var(--ink); line-height: 1.5; }
        a { color: inherit; text-decoration: none; }
        .wrap { width: min(1140px, 91%); margin: auto; }
        header { position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,.96); backdrop-filter: blur(8px); border-bottom: 1px solid var(--blush); }
        nav { min-height: 76px; display: flex; align-items: center; justify-content: space-between; }
        .brand { font-family: Georgia, serif; font-size: 1.55rem; color: var(--wine); font-weight: 500; }
        .btn { display: inline-flex; justify-content: center; align-items: center; background: var(--wine); color: white; padding: 12px 24px; border: none; font-size: .95rem; cursor: pointer; text-decoration: none; }
        .page-header { background: var(--blush); padding: 60px 0; text-align: center; }
        .eyebrow { text-transform: uppercase; letter-spacing: 2px; font-size: .75rem; color: var(--rose); margin-bottom: 12px; font-weight: 600; }
        h1, h3 { font-family: Georgia, serif; font-weight: 500; color: var(--wine); margin: 0; }
        h1 { font-size: 2.5rem; }
        .subtitle { font-size: 1.05rem; color: #666565; max-width: 500px; margin: 15px auto 0 auto; }
        .team-section { padding: 60px 0; }
        .team-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
        .team-card { background: white; border: 1px solid var(--blush); text-align: center; padding: 25px; }
        .avatar-container { width: 160px; height: 160px; margin: 0 auto 20px auto; }
        .avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #e0d0cc; border: 3px solid var(--blush); }
        .team-card h3 { font-size: 1.4rem; margin-bottom: 4px; }
        .role { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: var(--rose); font-weight: 600; margin-bottom: 12px; }
        .bio { font-size: 0.95rem; color: #666565; margin: 0; }
        footer { background: #30242a; color: #f8eeed; padding: 30px 0; font-size: 0.9rem; text-align: center; margin-top: 40px; }
        @media (max-width: 760px) {
            nav { justify-content: center; flex-direction: column; gap: 15px; padding: 15px 0; }
            .btn { width: 100%; text-align: center; min-height: 48px; }
            .team-grid { grid-template-columns: 1fr; gap: 20px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="wrap nav">
            <a class="brand" href="index.html">The Bridal Bloom</a>
            <a class="btn" href="index.html#contact">Book a Visit</a>
        </div>
    </header>
    <main>
        <section class="page-header">
            <div class="wrap">
                <div class="eyebrow">The Hands Behind the Glow</div>
                <h1>Meet Our Artisans</h1>
                <p class="subtitle">Our certified team of beauty professionals is dedicated to bringing your personal vision to life.</p>
            </div>
        </section>
        <section class="team-section">
            <div class="wrap"><div class="team-grid" id="teamContainer"></div></div>
        </section>
    </main>
    <footer><div class="wrap">&copy; The Bridal Bloom. All rights reserved.</div></footer>

    <!-- استبدل فقط وسم الـ <script> في أسفل صفحة team.html بهذا الكود المحدث -->
<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB6d5RVyz6F3al09iqBV7ewrbR_n4rXFbo",
    authDomain: "://firebaseapp.com",
    projectId: "bloom-1959f",
    storageBucket: "bloom-1959f.firebasestorage.app",
    messagingSenderId: "249083863881",
    appId: "1:249083863881:web:737f41f67f559faf61b098",
    measurementId: "G-K1MHZ8BHSR"
  };
  
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  db.collection('team').orderBy('createdAt', 'asc').onSnapshot((snapshot) => {
      const container = document.getElementById('teamContainer');
      container.innerHTML = snapshot.empty ? '<p style="grid-column:1/-1;text-align:center;color:#777;">No team members added yet.</p>' : '';
      
      snapshot.forEach((doc) => {
          const emp = doc.data();
          container.innerHTML += `
              <article class="team-card">
                  <!-- تم استخدام صورة رمزية افتراضية ومتناسقة مع الهوية بصيغة SVG -->
                  <div class="avatar-container">
                      <svg class="avatar" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org" style="background:#f8eeed; padding:20px; width:100%; height:100%; border-radius:50%; border:3px solid #f8eeed;">
                          <path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z" fill="#713b4d"/>
                      </svg>
                  </div>
                  <h3>${emp.name}</h3><div class="role">${emp.role}</div><p class="bio">${emp.bio}</p>
              </article>`;
      });
  });
</script>
    
    </script>
</body>
</html>
